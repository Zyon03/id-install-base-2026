        contact_number:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        fnb_or_yps:
          type: string
          nullable: true
        psa_status:
          type: string
          nullable: true
        psa_contract:
          type: string
          nullable: true
        psa_end_date:
          type: string
          format: date-time
          nullable: true
        sales_rep:
          type: string
          nullable: true
        ops_team:
          type: string
          nullable: true
        equip_tag:
          type: string
          nullable: true
          description: Required field — rejected if null/blank.
        model:
          type: string
          nullable: true
          description: Required field — rejected if null/blank.
        compressor_type:
          type: string
          nullable: true
          description: Required field — rejected if null/blank.
        serial_number:
